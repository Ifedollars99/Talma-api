# Local MongoDB for Talma.
# Docker is OPTIONAL — if you do not have Docker running, point MONGODB_URI at
# a MongoDB Atlas cluster instead (see server/.env.example).
#
#   docker compose up -d
#
services:
  mongodb:
    image: mongo:7
    container_name: talma-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: talma
    volumes:
      - talma-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  talma-mongo-data:
